name: Web checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/rafik-vite.log 2>&1 &
      - run: npx playwright test --project=chromium --grep 'guest reaches|Arabic sample'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/

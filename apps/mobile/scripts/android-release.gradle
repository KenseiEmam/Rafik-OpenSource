// Maintained release configuration; generated android/ sources are disposable.
def config = new groovy.json.JsonSlurper().parse(new File(rootDir, '../app.json')).expo
android.defaultConfig {
    versionName config.version
    versionCode config.android.versionCode as Integer
    minSdkVersion 24
}

def signingNames = ['RAFIK_ANDROID_KEYSTORE', 'RAFIK_ANDROID_STORE_PASSWORD', 'RAFIK_ANDROID_KEY_ALIAS', 'RAFIK_ANDROID_KEY_PASSWORD']
def signingReady = signingNames.every { System.getenv(it) }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && !signingReady) {
    throw new GradleException('Release signing is required. Use npm run mobile:release; debug signing fallback is forbidden.')
}
// Override Expo's generated debug-key fallback even when Gradle is invoked directly.
android.buildTypes.release.signingConfig = null
if (signingReady) {
    android.signingConfigs.create('rafikRelease') {
        storeFile file(System.getenv('RAFIK_ANDROID_KEYSTORE'))
        storePassword System.getenv('RAFIK_ANDROID_STORE_PASSWORD')
        keyAlias System.getenv('RAFIK_ANDROID_KEY_ALIAS')
        keyPassword System.getenv('RAFIK_ANDROID_KEY_PASSWORD')
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.rafikRelease
}

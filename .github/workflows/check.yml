name: Checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test --workspace @rafik/frontend
      - run: npm run build --workspace @rafik/frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run dev --workspace @rafik/frontend > /tmp/rafik-vite.log 2>&1 &
      - run: npm run test:e2e:running --workspace @rafik/frontend -- --project=chromium --grep 'guest reaches|Arabic sample'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: apps/frontend/test-results/
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run backend:start
      - run: npm run seed:local
      - run: npm run docs:check
      - run: npm run backend:test
      - run: npm run start:api > /tmp/rafik-api.log 2>&1 &
      - run: curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:55331/health
      - run: npm run content:media
      - run: npm run content:exercise-dataset -- --check
      - run: npm run content:wger-exercises -- --check
      - run: npm run content:videos
      - run: npm run test:catalog
      - run: npm run backend:typecheck
      - run: npm run test:api
      - run: npm run test:services
      - run: npm run test:teams
      - run: npm run test:organizations
      - run: npm run test:programming
      - run: npm run test:operations
      - run: npm run test:communication
      - run: npm run test:organization-services
      - run: npm run test:organization-nutrition
      - run: npm run test:organization-assets
      - run: npm run test:organization-tasks
      - run: npm run test:organization-packages
      - run: npm run test:organization-feedback
      - run: npm run backend:stop
        if: always()
